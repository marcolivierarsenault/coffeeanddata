services:
  preview:
    image: nginx:alpine
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "192.168.2.100:8765:8080"
    volumes:
      - ..:/site:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 64m
