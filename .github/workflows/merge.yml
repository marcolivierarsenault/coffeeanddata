name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Allow one production deployment at a time. Never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check, build and test the generated site
        run: npm run verify
      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
          include-hidden-files: true

  links:
    name: External links
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: artifact
      - name: Unpack the Pages artifact
        run: mkdir dist && tar -xf artifact/artifact.tar -C dist
      - name: Check external links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }}/dist 'dist/**/*.html'
          fail: true

  deploy:
    name: Deploy to GitHub Pages
    needs: [verify, links]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history improves SonarQube analysis.
      - uses: sonarsource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
