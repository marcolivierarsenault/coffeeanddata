name: Build and check
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - gh-pages
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Validate, build and check links
        run: npm run verify
      - name: Save the review build and dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: coffeeanddata-preview
          path: |
            dist/
            package-lock.json
          retention-days: 14
