services:
  prepare:
    image: node:24-alpine
    profiles: [tools]
    user: "${BLOG_UID:-1000}:${BLOG_GID:-1000}"
    working_dir: /app
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      npm_config_cache: /tmp/npm
    volumes:
      - .:/app
    command:
      - sh
      - -c
      - npm run import:images && if [ -f package-lock.json ]; then npm ci; else npm install; fi && npm run verify
  blog:
    image: nginx:alpine
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "192.168.2.100:8765:8080"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    user: "65534:65534"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 64m
